<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vyapari Mitra assistant demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFEAE2;--panel:#F7F4EE;--ink:#1C1C1C;--muted:#6B6B6B;--line:rgba(0,0,0,.08);--wa:#075E54;--wa2:#25D366;--me:#DCF8C6;--gold:#8E6E10}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Mukta',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);height:100%;min-height:420px}
/* stream */
.stream{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.stream .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.stream .hd b{font-size:15px;font-weight:600}
.stream .hd small{font-size:11.5px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#B3261E;font-weight:600;letter-spacing:.08em}
.live i{width:7px;height:7px;border-radius:50%;background:#B3261E;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:10px 14px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-size:22px;font-weight:600;line-height:1.1}
.stats span{font-size:11.5px;color:var(--muted)}
.feed{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;animation:in .4s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card .who{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.card .who b{color:var(--ink);font-weight:600}
.card .q{font-weight:500}
.card .a{color:#2f2f2f;font-size:13.5px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.card .a::before{content:"सहाय्यक: ";color:var(--wa);font-weight:600}
.card .tag{display:inline-block;margin-top:6px;font-size:11px;padding:2px 8px;border-radius:999px;background:#FFF2D6;color:var(--gold);font-weight:600}
.card .tag.h{background:#E8EEF9;color:#3B5BA5}
/* chat */
.chat{display:flex;flex-direction:column;min-height:0;background:#E5DDD5 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' opacity='.06'><circle cx='20' cy='20' r='6' fill='%23000'/><rect x='70' y='60' width='14' height='14' fill='%23000'/><path d='M30 90l10-14 10 14z' fill='%23000'/></svg>")}
.chat .hd{background:var(--wa);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.chat .hd i{width:34px;height:34px;border-radius:50%;background:#fff url(../img/vm-logo.png) center/cover}
.chat .hd b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.chat .hd small{font-size:11.5px;opacity:.85}
.msgs{flex:1;overflow:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.m{max-width:84%;padding:8px 11px;border-radius:9px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:14.5px;animation:in .3s ease-out both;white-space:pre-line}
.m.u{align-self:flex-end;background:var(--me)}
.m small{display:block;font-size:10.5px;color:#8a8a8a;text-align:right;margin-top:3px}
.m a{color:#0b6b5b;font-weight:600;text-decoration:underline}
.m .btn{display:inline-block;margin-top:6px;border:1px solid #0b6b5b;color:#0b6b5b;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600}
.typing{align-self:flex-start;background:#fff;border-radius:9px;padding:9px 12px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#999;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px}
.chips button{font:inherit;font-size:12.5px;background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:5px 11px;cursor:pointer;color:#2f2f2f}
.chips button:hover{background:#f3f3f3}
.in{display:flex;gap:8px;padding:8px 10px 10px;background:#F0F0F0}
.in input{flex:1;font:inherit;font-size:15px;padding:10px 14px;border:1px solid rgba(0,0,0,.12);border-radius:22px;background:#fff;outline:none}
.in input:focus{border-color:var(--wa2)}
.in button{font:inherit;width:44px;height:44px;border-radius:50%;border:0;background:var(--wa2);color:#fff;font-weight:700;cursor:pointer;font-size:18px}
.note{font-size:10.5px;color:#777;text-align:center;padding:0 10px 6px;background:#F0F0F0}
@media(max-width:720px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .stream{order:2;max-height:38%;border-right:0;border-top:1px solid var(--line)}
  .chat{order:1}
  .stats b{font-size:18px}
}
</style>
</head>
<body>

  <section class="stream">
    <div class="hd"><div><b>आज आलेले प्रश्न</b><br><small>वेबसाइट आणि WhatsApp, दोन्हीकडून</small></div><span class="live"><i></i>LIVE</span></div>
    <div class="stats"><div><b id="sQ">0</b><span>प्रश्न आज</span></div><div><b id="sA">0</b><span>लगेच उत्तर</span></div><div><b id="sL">0</b><span>नवीन लीड्स</span></div></div>

  </section>
</div>
